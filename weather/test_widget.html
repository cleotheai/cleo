<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Windguru Widget Test</title>
<style>
body { font-family: sans-serif; padding: 20px; background: #0f1117; color: #e2e8f0; }
#windguru-widget { width: 100%; min-height: 500px; border: 2px solid #2d3140; }
</style>
</head>
<body>
<h1>Windguru Widget Test</h1>
<p>If the widget loads below, the uid and endpoints work.</p>
<div id="windguru-widget"></div>
<script>
(function (window, document) {
  var loader = function () {
    var arg = [
      "s=32728",
      "m=100",
      "mw=84",
      "uid=wg_fwdg_32728_100_1790433326398",
      "wj=knots",
      "tj=c",
      "waj=m",
      "tij=m",
      "odh=0",
      "doh=24",
      "fhours=240",
      "hrsm=1",
      "vt=forecasts",
      "lng=en",
      "idbs=1",
      "ts=1",
      "p=WINDSPD,GUST,SMER,HTSGW,PERPW,DIRPW"
    ];
    var script = document.createElement("script");
    var tag = document.getElementsByTagName("script")[0];
    script.src = "https://www.windguru.cz/js/widget.php?" + (arg.join("&"));
    tag.parentNode.insertBefore(script, tag);
  };
  window.addEventListener ? window.addEventListener("load", loader, false) : window.attachEvent("onload", loader);
})(window, document);
</script>
</body>
</html>
