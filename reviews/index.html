    <style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0f1117;color:#e2e8f0;min-height:100vh;padding:24px 16px}
.container{max-width:720px;margin:0 auto}
.header{margin-bottom:32px;padding-bottom:24px;border-bottom:1px solid #2d3140}
.header h1{font-size:1.5rem;font-weight:600;margin-bottom:4px}

.review-title{font-size:1.05rem;font-weight:500;margin-bottom:8px}
.review-title a{color:#60a5fa;text-decoration:none}
.review-title a:hover{text-decoration:underline}
.review-text{font-size:.9rem;line-height:1.6;color:#cbd5e1;margin-bottom:12px}
.review-meta{padding-top:12px;border-top:1px solid #2d3140}
.empty-state{text-align:center;padding:60px 20px;color:#64748b}
